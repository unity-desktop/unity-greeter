# unity-greeter uses the wf-config file backend (wayfire -c wayfire.ini).
# The session runs wayfire -B wf-config-gsettings, which reads dconf and
# ignores this file. Two backends because the greeter's per-output scale
# is mirrored per user to /var/lib/unity-greeter/<user>/; that shape is
# a plain ini fragment, not a dconf key.

[core]
plugins = autostart animate blur input-method-v1 xdg-activation gtk-shell window-rules

[autostart]
autostart_wf_shell = false
unity_greeter = unity-greeter

[idle]
dpms_timeout = 120

[input]
tap_to_click = true
tap_and_drag = true
natural_scroll = true

[blur]
blur_by_default = all
method = kawase
kawase_degrade = 4
kawase_iterations = 4
kawase_offset = 4.0
saturation = 1.4
toggle = none
