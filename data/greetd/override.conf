# Drop-in override for greetd, aligning its stop and restart behaviour with
# gdm.service. Without this, greetd on logout leaves phoc and wlroots inside
# a 30 s SIGTERM grace window and receiving SIGHUP first, which delays the
# TTY1 release and can hang the next greeter run.
#
# Install as /etc/systemd/system/greetd.service.d/override.conf, then
# `systemctl daemon-reload && systemctl restart greetd`.

[Service]
KillMode=mixed
SendSIGHUP=no
RestartSec=0
