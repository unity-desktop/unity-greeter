# See https://bilelmoussaoui.github.io/gobject-linter/ for rule reference.

default_level = "error"

ignore = [
  "build/**",
  "subprojects/**",
]

# Wayland protocol callbacks match struct signatures generated by
# wayland-scanner. Those use `uint32_t` / `const char *` verbatim, and
# our listeners must match exactly. Skip the type-style rule for the
# one file that binds Wayland protocols directly.
[rules.type_style]
ignore = [
  "src/unity-greeter-idle.c",
]
